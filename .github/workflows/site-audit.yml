name: Site audit

on:
  schedule:
    - cron: '0 6 * * *' # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (leave empty for the BASE_URL repo variable, else production)'
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:

concurrency:
  group: site-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Headroom only: a full run takes a few minutes. Hitting this means the site or the suite got slow.
    timeout-minutes: 30
    # Same image as `npm run test:visual:update:linux`, so visual baselines match. Keep in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    env:
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL || 'https://www.houserx.com' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -p .

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  # Publishes the latest HTML report from main, pass or fail, at the repo's GitHub Pages URL.
  # Needs Settings → Pages → Source: GitHub Actions.
  publish-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
